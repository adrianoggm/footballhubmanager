version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: footballhub_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: footballhub
      MYSQL_USER: footballuser
      MYSQL_PASSWORD: footballpass
    ports:
      - "3306:3306"
    volumes:
      - ../versioning/sql/actual.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - footballhub_network

