name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Ruff lint
        run: |
          python -m ruff check backend/src backend/tests

      - name: Run Ruff format check
        run: |
          python -m ruff format --check backend/src backend/tests

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend format check
        run: npm --prefix frontend run format:check

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run frontend build
        run: npm --prefix frontend run build

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest backend/tests --ignore=backend/tests/integration -q

  unit-tests-coverage-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run unit tests with coverage report
        id: unit_cov
        run: |
          set +e
          python -m pytest backend/tests --ignore=backend/tests/integration -q \
            --cov=backend/src \
            --cov-report=term-missing \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=html:backend/htmlcov \
            --junitxml=backend/junit-unit.xml | tee backend/pytest-unit.log
          test_exit=${PIPESTATUS[0]}
          echo "exit_code=${test_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build coverage and failure summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Unit Test Coverage Report"]

          coverage_path = Path("backend/coverage.xml")
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
              branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
              lines.append(f"- Line coverage: **{line_rate:.2f}%**")
              lines.append(f"- Branch coverage: **{branch_rate:.2f}%**")
          else:
              lines.append("- Coverage report not generated.")

          lines.append("")
          lines.append("## Unit Test Results")

          junit_path = Path("backend/junit-unit.xml")
          if not junit_path.exists():
              lines.append("- JUnit report not generated.")
          else:
              root = ET.parse(junit_path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))

              total = failures = errors = skipped = 0
              failed_tests = []

              for suite in suites:
                  total += int(suite.attrib.get("tests", 0))
                  failures += int(suite.attrib.get("failures", 0))
                  errors += int(suite.attrib.get("errors", 0))
                  skipped += int(suite.attrib.get("skipped", 0))
                  for case in suite.iter("testcase"):
                      for node in case:
                          if node.tag in {"failure", "error"}:
                              classname = case.attrib.get("classname", "unknown")
                              name = case.attrib.get("name", "unknown")
                              message = (node.attrib.get("message", "") or "").strip()
                              first_line = message.splitlines()[0][:240] if message else ""
                              failed_tests.append((classname, name, node.tag, first_line))
                              break

              passed = total - failures - errors - skipped
              lines.append(f"- Total: **{total}**")
              lines.append(f"- Passed: **{passed}**")
              lines.append(f"- Failed: **{failures}**")
              lines.append(f"- Errors: **{errors}**")
              lines.append(f"- Skipped: **{skipped}**")
              lines.append("")
              lines.append("### Failed Tests")

              if failed_tests:
                  for classname, name, kind, first_line in failed_tests[:50]:
                      test_id = f"`{classname}::{name}`"
                      if first_line:
                          lines.append(f"- {test_id} ({kind}): {first_line}")
                      else:
                          lines.append(f"- {test_id} ({kind})")
                  if len(failed_tests) > 50:
                      lines.append(f"- ... and {len(failed_tests) - 50} more failed tests.")
              else:
                  lines.append("- None")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-coverage-report
          path: |
            backend/coverage.xml
            backend/junit-unit.xml
            backend/pytest-unit.log
            backend/htmlcov
          if-no-files-found: warn

      - name: Fail if unit tests failed
        if: steps.unit_cov.outputs.exit_code != '0'
        run: |
          echo "Unit tests failed. Review the summary and artifacts for details."
          exit 1

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start containerized backend stack
        run: |
          docker compose -f docker/docker-compose.ci.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/ > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose -f docker/docker-compose.ci.yml logs
          exit 1

      - name: Run integration tests
        env:
          TEST_API_ROOT: http://127.0.0.1:8000/api
          TEST_API_V1: http://127.0.0.1:8000/api/v1
        run: |
          python -m pytest backend/tests/integration -q

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop containerized backend stack
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v
