{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "footballhub.fullname" . }}-migrate
  labels:
    {{- include "footballhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before the API rolls out, and block the release until it succeeds, so
    # the backend never serves against an un-migrated schema.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "footballhub.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        # Wait for the database to accept TCP before migrating. (With an external
        # managed DB this is instant; with in-cluster MySQL on the very first
        # install see NOTES.txt — set migrations.enabled=false for the install.)
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "footballhub.dbHost" . }} {{ .Values.database.port }}; do
                echo "waiting for database..."; sleep 2;
              done
        {{- if .Values.migrations.backup.enabled }}
        # Dump the database before touching the schema. If the dump fails the Job
        # fails and migrate never runs. Rollback (down files) cannot restore data a
        # migration dropped; this dump can.
        - name: backup-db
          image: {{ .Values.migrations.backup.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              file="/backups/${DB_NAME}-$(date -u +%Y%m%dT%H%M%SZ).sql"
              echo "dumping ${DB_NAME} to ${file}"
              mysqldump --host="${DB_HOST}" --port="${DB_PORT}" --user="${DB_USER}" \
                --single-transaction --no-tablespaces "${DB_NAME}" > "${file}"
              echo "backup written: ${file} ($(wc -c < "${file}") bytes)"
          envFrom:
            - configMapRef:
                name: {{ include "footballhub.fullname" . }}-config
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "footballhub.dbSecretName" . }}
                  key: {{ .Values.database.passwordSecretKey }}
          volumeMounts:
            - name: backups
              mountPath: /backups
        {{- end }}
      containers:
        - name: migrate
          image: {{ include "footballhub.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ .Values.migrations.args | toJson }}
          envFrom:
            - configMapRef:
                name: {{ include "footballhub.fullname" . }}-config
          env:
            {{- include "footballhub.dbPasswordEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- if .Values.migrations.backup.enabled }}
      volumes:
        - name: backups
          {{- if .Values.migrations.backup.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.migrations.backup.existingClaim | quote }}
          {{- else }}
          # No claim configured: the dump only proves the DB is dumpable and is
          # discarded with the pod. Set migrations.backup.existingClaim in prod.
          emptyDir: {}
          {{- end }}
      {{- end }}
{{- end }}
