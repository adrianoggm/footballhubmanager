{{- if .Values.metrics.alerts.enabled }}
{{- $job := printf "%s-backend" (include "footballhub.fullname" .) }}
# Alert rules for the Prometheus Operator. Notification routing (Slack/email) is
# Alertmanager config and lives with the kube-prometheus-stack release, not here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "footballhub.fullname" . }}-backend
  labels:
    {{- include "footballhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.metrics.serviceMonitorLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: footballhub-backend
      rules:
        - alert: BackendDown
          expr: up{job="{{ $job }}"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Backend target {{ $job }} is down"
            description: "No backend instance has been scrapeable for 2 minutes."
        - alert: BackendHigh5xxRate
          expr: |
            sum(rate(http_requests_total{job="{{ $job }}",status="5xx"}[5m]))
              / sum(rate(http_requests_total{job="{{ $job }}"}[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Backend 5xx rate above 5%"
            description: "More than 5% of requests have returned 5xx for 5 minutes."
        - alert: BackendHighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ $job }}"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Backend p99 latency above 1s"
            description: "99th percentile request latency has exceeded 1s for 10 minutes."
        - alert: BackendPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{container="backend"}[15m]) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Backend pod is restarting"
            description: "A backend container has restarted in the last 15 minutes."
{{- end }}
