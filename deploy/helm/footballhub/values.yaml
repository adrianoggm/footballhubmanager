# Default values for the footballhub chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  owner: adrianoggm
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when tag is empty.
  tag: ""

backend:
  image:
    repository: footballhubmanager-backend
  replicas: 2
  containerPort: 8000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  image:
    repository: footballhubmanager-frontend
  replicas: 2
  containerPort: 8080
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Non-secret application configuration (rendered into a ConfigMap, shared by the
# backend Deployment and the migration Job).
app:
  env: production
  allowedHosts: "" # comma-separated; e.g. "api.example.com"
  corsAllowedOrigins: "" # e.g. "https://app.example.com"
  rateLimit:
    enabled: true
    requests: 300
    authRequests: 20
    windowSeconds: 60
  linkTokenTtlSeconds: 86400
  sessionTtlSeconds: 3600
  # Refuse to start the API if the schema has pending migrations (fail fast in
  # prod). Disable for the in-cluster first-install two-step (see NOTES.txt).
  strictMigrationCheck: true
  extraEnv: {} # arbitrary extra non-secret env: KEY: value

# Schema migrations run as a Helm pre-install,pre-upgrade hook Job (backend image,
# args below). Helm blocks the rollout until it succeeds, so the API never serves
# against an un-migrated schema.
migrations:
  enabled: true
  # Use ["stamp"] (or ["stamp","<N>"]) for the FIRST deploy against an existing
  # database to baseline it without re-running present migrations; ["migrate"]
  # thereafter. See docs/deployment.md.
  args: ["migrate"]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Database connection. Two modes via `mysql.enabled`:
#   true  -> an in-cluster MySQL StatefulSet (good for dev / small setups)
#   false -> an external/managed database (recommended for production)
database:
  name: footballhub
  user: footballuser
  port: 3306
  provider: mysql+pymysql
  # Secret + key holding DB_PASSWORD. Leave existingSecret empty to let the chart
  # create one from the password values below.
  existingSecret: ""
  passwordSecretKey: DB_PASSWORD

mysql:
  enabled: true
  image: mysql:8.0
  # Used only when mysql.enabled and database.existingSecret is empty.
  rootPassword: changeme-root
  password: changeme
  storage:
    size: 8Gi
    storageClassName: "" # "" uses the cluster default
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

externalDatabase:
  # Used only when mysql.enabled is false.
  host: ""
  # Password comes from database.existingSecret (recommended) or mysql.password.

# Prometheus scraping. Emits a ServiceMonitor for the backend (requires the
# Prometheus Operator CRDs from kube-prometheus-stack — see deploy/helm/README.md).
# Off by default so the chart installs fine on clusters without the operator.
metrics:
  enabled: false
  # The app serves under root_path=/api, so /metrics lands at /api/metrics on the pod.
  path: /api/metrics
  interval: 30s
  # kube-prometheus-stack only selects ServiceMonitors carrying its release label.
  # Set this to match the release name you installed the stack under.
  serviceMonitorLabels:
    release: kube-prometheus-stack

ingress:
  enabled: true
  className: ""
  host: footballhub.local
  annotations: {}
  # TLS terminates here at the ingress; the backend and frontend stay plain HTTP
  # inside the cluster. uvicorn trusts X-Forwarded-Proto, so the app still sees
  # the request as https.
  tls:
    enabled: false
    # Secret holding the cert/key for `host`. With cert-manager (clusterIssuer
    # set below) the cert is issued INTO this secret automatically; otherwise
    # create it yourself: kubectl create secret tls <name> --cert=... --key=...
    secretName: footballhub-tls
    # cert-manager ClusterIssuer (e.g. "letsencrypt-prod"). When set, the chart
    # adds the cert-manager.io/cluster-issuer annotation and the cert is
    # auto-issued and auto-renewed. Requires cert-manager installed in-cluster.
    clusterIssuer: ""
  # Redirect HTTP -> HTTPS at the ingress (nginx-ingress annotations). Turn on
  # once TLS works to avoid a redirect loop before the cert is ready.
  forceHttpsRedirect: false
  # Strict-Transport-Security header. Only enable once HTTPS is stable.
  hsts:
    enabled: false
    maxAge: 31536000 # 1 year, in seconds
    includeSubDomains: true
